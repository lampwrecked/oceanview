<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCEAN VIEW</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
  :root {
    --ink:#0a0e12; --foam:#f2f5f7; --buoy:#ffd23f; --rec:#ff3b3b;
    --dim:rgba(242,245,247,0.55); --line:rgba(242,245,247,0.18);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; color:var(--foam); font-family:var(--mono); overflow:hidden; }

  /* always a 16:9 frame, letterboxed */
  #collage {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(100vw, 177.7778vh); height:min(56.25vw, 100vh);
    display:block; background:var(--ink); touch-action:manipulation;
  }

  #hud {
    position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:12px 16px; font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    background:linear-gradient(rgba(10,14,18,0.85), rgba(10,14,18,0)); transition:opacity .4s ease;
  }
  .hud-hidden #hud, .hud-hidden #spotsbtn, .hud-hidden #spotlist, .hud-hidden #tunebtn, .hud-hidden #tune, .hud-hidden #keys { opacity:0; pointer-events:none; }
  #hud .title { font-weight:700; }
  #hud .title em { font-style:normal; color:var(--buoy); }
  #hud .meta { color:var(--dim); text-align:right; }
  #hud .meta b { color:var(--foam); font-weight:400; }
  #hud .meta .rec { color:var(--rec); font-weight:700; display:none; }
  #hud .btns { display:flex; gap:8px; }
  #hud button {
    background:none; border:1px solid var(--line); color:var(--foam); font-family:var(--mono);
    font-size:10px; letter-spacing:0.12em; text-transform:uppercase; padding:6px 10px; cursor:pointer;
  }
  #hud button:hover { border-color:var(--foam); }
  #hud button:focus-visible { outline:2px solid var(--buoy); outline-offset:2px; }
  #hud button.on { border-color:var(--rec); color:var(--rec); }

  #spotsbtn {
    position:fixed; bottom:12px; left:14px; z-index:22;
    background:rgba(10,14,18,0.8); border:1px solid var(--line); color:var(--foam);
    font-family:var(--mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase;
    padding:8px 12px; cursor:pointer; transition:opacity .4s ease;
  }
  #spotsbtn.open, #spotsbtn:hover { border-color:var(--buoy); }
  #spotlist {
    position:fixed; bottom:44px; left:14px; z-index:22; display:none;
    background:rgba(10,14,18,0.92); border:1px solid var(--line);
    padding:10px 14px; font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
    line-height:2.1; max-height:60vh; overflow-y:auto; min-width:230px;
  }
  #spotlist.open { display:block; }
  #spotlist .row b { color:var(--buoy); font-weight:700; }
  #spotlist .row i { font-style:normal; color:var(--dim); }
  #tune {
    position:fixed; bottom:44px; right:14px; z-index:22; display:none;
    background:rgba(10,14,18,0.92); border:1px solid var(--line); padding:12px 14px;
    font-size:10px; letter-spacing:0.12em; text-transform:uppercase; min-width:210px;
  }
  #tune.open { display:block; }
  #tune { max-height:70vh; overflow-y:auto; min-width:240px; }
  #tabbar { display:flex; gap:4px; border-bottom:1px solid var(--line); padding-bottom:8px; }
  .tab-btn {
    flex:1; background:none; border:1px solid var(--line); color:var(--dim); font-family:var(--mono);
    font-size:9px; letter-spacing:0.1em; text-transform:uppercase; padding:5px 0; cursor:pointer;
  }
  .tab-btn.active { border-color:var(--buoy); color:var(--buoy); }
  .tab { display:none; }
  .tab.active { display:block; }
  #tune label { display:block; color:var(--dim); margin:8px 0 2px; }
  #soundbtn {
    width:100%; margin-top:12px; background:none; border:1px solid var(--line); color:var(--foam);
    font-family:var(--mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; padding:7px 0; cursor:pointer;
  }
  #soundbtn.on { border-color:var(--buoy); color:var(--buoy); }
  #solobig {
    width:100%; margin-top:12px; background:none; border:1px solid var(--line); color:var(--foam);
    font-family:var(--mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; padding:7px 0; cursor:pointer;
  }
  #solobig.on { border-color:var(--buoy); color:var(--buoy); }
  #daybtn {
    width:100%; margin-top:8px; background:none; border:1px solid var(--line); color:var(--foam);
    font-family:var(--mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; padding:7px 0; cursor:pointer;
  }
  #daybtn.on { border-color:var(--buoy); color:var(--buoy); }
  #rankbtn {
    width:100%; margin-top:8px; background:none; border:1px solid var(--line); color:var(--foam);
    font-family:var(--mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; padding:7px 0; cursor:pointer;
  }
  #rankbtn.on { border-color:var(--buoy); color:var(--buoy); }
  #oceanbtn, #energybtn, #scalebtn, #shufflebtn, #kioskbtn {
    width:100%; margin-top:8px; background:none; border:1px solid var(--line); color:var(--foam);
    font-family:var(--mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; padding:7px 0; cursor:pointer;
  }
  #kioskbtn.on, #energybtn.on { border-color:var(--buoy); color:var(--buoy); }
  #channels .ch.night .nm { color:var(--dim); }
  #channels .ch .moon { color:var(--dim); }
  #channels { margin-top:10px; border-top:1px solid var(--line); padding-top:8px; }
  #channels .ch { display:flex; align-items:center; gap:6px; line-height:2; }
  #channels .ch .nm { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #channels .ch .dt { color:var(--dim); }
  #channels .ch .dt b { color:var(--buoy); font-weight:700; }
  #channels .ch button {
    background:none; border:1px solid var(--line); color:var(--dim); font-family:var(--mono);
    font-size:9px; padding:2px 6px; cursor:pointer;
  }
  #channels .ch button.on { border-color:var(--buoy); color:var(--buoy); }
  #tune label span { color:var(--buoy); float:right; }
  #tune input[type=range] { width:100%; accent-color:var(--buoy); }
  #tunebtn {
    position:fixed; bottom:12px; right:14px; z-index:22;
    background:rgba(10,14,18,0.8); border:1px solid var(--line); color:var(--foam);
    font-family:var(--mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase;
    padding:8px 12px; cursor:pointer; transition:opacity .4s ease;
  }
  #tunebtn.open, #tunebtn:hover { border-color:var(--buoy); }
  #tapinfo {
    position:fixed; z-index:23; display:none; pointer-events:none;
    background:rgba(10,14,18,0.92); border-left:2px solid var(--buoy);
    padding:6px 10px; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; line-height:1.8;
    white-space:nowrap;
  }
  #tapinfo b { color:var(--buoy); font-weight:700; }

  #boot {
    position:fixed; inset:0; z-index:30; background:var(--ink);
    display:flex; flex-direction:column; justify-content:center; align-items:center; padding:24px;
  }
  #boot.gone { display:none; }
  #boot h1 { font-size:clamp(22px,5vw,44px); font-weight:700; letter-spacing:0.28em; text-transform:uppercase; margin-bottom:6px; }
  #boot h1 span { color:var(--buoy); }
  #boot .sub { color:var(--dim); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; margin-bottom:28px; }
  #bootlog { width:min(560px,92vw); max-height:46vh; overflow-y:auto; font-size:11px; line-height:1.9; border-top:1px solid var(--line); padding-top:14px; }
  #bootlog .ok { color:var(--buoy); } #bootlog .bad { color:var(--dim); text-decoration:line-through; } #bootlog .info { color:var(--foam); }
  #boot .retry { margin-top:22px; background:none; border:1px solid var(--foam); color:var(--foam); font-family:var(--mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; padding:10px 18px; cursor:pointer; display:none; }

  #bootbar { width:min(560px,92vw); margin:0 0 14px; }
  #bootbar .track { height:6px; background:var(--line); overflow:hidden; }
  #bootbar .fill { height:100%; width:0%; background:var(--buoy); transition:width .25s ease; }
  #bootbar .stat { display:flex; justify-content:space-between; margin-top:6px; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--dim); }
  #bootbar .stat b { color:var(--foam); font-weight:400; }
  #bootlog .rank { color:var(--dim); }
  #bootlog .rank b { color:var(--buoy); font-weight:700; }
  #bootlog .trying { color:var(--foam); }

  #keys { position:fixed; bottom:10px; right:14px; z-index:21; font-size:10px; color:var(--dim); letter-spacing:0.1em; text-transform:uppercase; transition:opacity .4s ease; }

  @media (prefers-reduced-motion: reduce) { #hud, #spotsbtn, #tunebtn, #keys { transition:none; } }
</style>
</head>
<body>
<canvas id="collage"></canvas>

<div id="hud">
  <div class="title">OCEAN<em>VIEW</em></div>
  <div class="btns">
    <button id="btnrec" title="Record 4K 16:9 webm">● REC 4K</button>
    <button id="btnpng" title="Save PNG frame">PNG</button>
  </div>
  <div class="meta">
    <span class="rec" id="recstat">● REC <b id="rectime">00:00</b> · </span>
    <span id="livecount">—</span> LIVE · MAX <b id="maxwave">—</b> · RECOMPOSE <b id="countdown">30:00</b>
  </div>
</div>
<button id="spotsbtn">▲ SPOTS</button>
<div id="spotlist"></div>
<button id="tunebtn">TUNE</button>
<div id="tune">
  <div id="tabbar">
    <button class="tab-btn active" data-tab="image">IMAGE</button>
    <button class="tab-btn" data-tab="fluid">FLUID</button>
    <button class="tab-btn" data-tab="waves">WAVES</button>
    <button class="tab-btn" data-tab="set">SET</button>
  </div>
  <div class="tab active" id="tab-image">
    <label>PIXEL SIZE <span id="cellval">220</span></label>
    <input type="range" id="cellslider" min="40" max="220" step="4" value="220">
    <label>JITTER <span id="jitval">0.6</span></label>
    <input type="range" id="jitslider" min="0" max="3" step="0.05" value="0.6">
    <label>SATURATION <span id="satval">1.0</span></label>
    <input type="range" id="satslider" min="0" max="1.6" step="0.05" value="1">
    <button id="shufflebtn">SHUFFLE GRID</button>
  </div>
  <div class="tab" id="tab-fluid">
    <label>FLUID <span id="fluidval">1.0</span></label>
    <input type="range" id="fluidslider" min="0" max="2.5" step="0.05" value="1">
    <label>CURL <span id="curlval">20</span></label>
    <input type="range" id="curlslider" min="0" max="45" step="1" value="20">
    <label>SPLAT <span id="splatval">6</span></label>
    <input type="range" id="splatslider" min="1" max="30" step="1" value="6">
    <label>SMEAR <span id="smearval">0.82</span></label>
    <input type="range" id="smearslider" min="0" max="0.97" step="0.01" value="0.82">
    <label>DECAY <span id="decayval">0.985</span></label>
    <input type="range" id="decayslider" min="0.90" max="0.999" step="0.001" value="0.985">
    <button id="energybtn">FORCE: HEIGHT</button>
  </div>
  <div class="tab" id="tab-waves">
    <label>FREEFORM SEA (break the pixels) <span id="freeval">0.00</span></label>
    <input type="range" id="freeslider" min="0" max="1" step="0.01" value="0">
    <label>FREEFORM FLOW (drift) <span id="flowval">1.00</span></label>
    <input type="range" id="flowslider" min="0" max="3" step="0.05" value="1">
    <label>SWELL FORCE (sustained) <span id="swellval">1.0</span></label>
    <input type="range" id="swellslider" min="0" max="3" step="0.05" value="1">
    <label>REFRACT (swell warp) <span id="refrval">1.0</span></label>
    <input type="range" id="refrslider" min="0" max="3" step="0.05" value="1">
    <label>TEAR (crest row-shift) <span id="tearval">0.6</span></label>
    <input type="range" id="tearslider" min="0" max="2" step="0.05" value="0.6">
    <label>CHROMA SPLIT <span id="chromval">0.6</span></label>
    <input type="range" id="chromslider" min="0" max="2" step="0.05" value="0.6">
    <label>FOAM (crest whitewash) <span id="foamval">0.5</span></label>
    <input type="range" id="foamslider" min="0" max="1.5" step="0.05" value="0.5">
    <label>RINGS (pulse ripples) <span id="ringval">1.0</span></label>
    <input type="range" id="ringslider" min="0" max="3" step="0.05" value="1">
    <label>BLOCK SNAP (crest quantize) <span id="snapval">0.4</span></label>
    <input type="range" id="snapslider" min="0" max="1" step="0.05" value="0.4">
    <label>SET BREATH (whole-frame surge) <span id="surgeval">0.5</span></label>
    <input type="range" id="surgeslider" min="0" max="1.5" step="0.05" value="0.5">
  </div>
  <div class="tab" id="tab-set">
    <button id="rankbtn">RANK: BIGGEST WAVES</button>
    <button id="oceanbtn">OCEAN: ALL</button>
    <button id="daybtn" class="on">DAYLIGHT ONLY: ON</button>
    <button id="solobig">SOLO EXTREME WAVE</button>
    <label>RECOMPOSE MIN <span id="recval">30</span></label>
    <input type="range" id="recslider" min="5" max="120" step="5" value="30">
    <button id="kioskbtn">KIOSK: OFF</button>
    <div id="channels"></div>
  </div>
</div>
<div id="tapinfo"></div>
<div id="keys">H HUD · F FULL · W FLUID · X SHUFFLE · B FREEFORM · R REC · S PNG · TAP A BLOCK</div>

<div id="boot">
  <h1>OCEAN<span>VIEW</span></h1>
  <div class="sub">live cams in near-frame glitch, weighted by live ocean · fluid pulsed on each spot's wave period</div>
  <div id="bootbar">
    <div class="track"><div class="fill" id="bootfill"></div></div>
    <div class="stat"><span id="bootphase">starting</span><span><b id="bootlive">0</b> / <b id="bootneed">10</b> live · <b id="boottried">0</b> tried</span></div>
  </div>
  <div id="bootlog"></div>
  <button class="retry" id="retrybtn">Retry</button>
</div>

function sunUp(lat, lon) {
  // solar elevation approximation; > -6 deg (civil twilight) counts as light
  const now = new Date(), rad = Math.PI / 180;
  const start = Date.UTC(now.getUTCFullYear(), 0, 0);
  const doy = (Date.now() - start) / 86400000;
  const decl = -23.44 * Math.cos((360 / 365) * (doy + 10) * rad);
  const solarHours = now.getUTCHours() + now.getUTCMinutes() / 60 + lon / 15;
  const ha = (solarHours - 12) * 15;
  const sinEl = Math.sin(lat * rad) * Math.sin(decl * rad) +
                Math.cos(lat * rad) * Math.cos(decl * rad) * Math.cos(ha * rad);
  return Math.asin(sinEl) / rad > 3;   // cameras need real sun, not twilight
}
function basinOf(lat, lon) {
  if (lat > 30 && lat < 47 && lon > -6 && lon < 37) return 'MEDITERRANEAN';

  if (lon >= 20 && lon < 120) return 'INDIAN';
  return 'ATLANTIC';
}

    const fail = () => { if (settled) return; settled = true; cleanup(); resolve(null); };
    const timer = setTimeout(fail, HEALTH_TIMEOUT);

    const vw = v.videoWidth, vh = v.videoHeight;
    const cx0 = vw*CROP.l, cy0 = vh*CROP.t, cw = vw*(1-CROP.l-CROP.r), ch = vh*(1-CROP.t-CROP.b);
    const fh = Math.max(2, Math.round(FC_W * ch / cw));
    if (!e.fc || e.fc.height !== fh) { e.fc = document.createElement('canvas'); e.fc.width = FC_W; e.fc.height = fh; e.fcx = e.fc.getContext('2d'); }
    e.fcx.drawImage(v, cx0, cy0, cw, ch, 0, 0, FC_W, fh); e.fcT = v.currentTime;
  });
}
/* adaptive resolution: if the frame loop can't hold ~40fps, step the render width down (blocks keep their owners) */
let frameEma = 16, slowSince = 0, fastSince = 0, liveCap = MAX_LIVE_W, lastMosaic = 0;
function adaptQuality(rawDt, now) {
  frameEma += (rawDt - frameEma) * 0.05;
  if (recorder || !bootEl.classList.contains('gone')) return;   // don't judge speed while streams are still loading
  if (frameEma > 25 && liveCap > 480) { if (!slowSince) slowSince = now; else if (now - slowSince > 2500) { liveCap = Math.max(480, Math.round(liveCap * 0.8 / 16) * 16); slowSince = 0; fastSince = 0; frameEma = 16; fitLive(); } }
  else slowSince = 0;
  // headroom again for a while → climb back toward the full cap
  if (frameEma < 15 && liveCap < MAX_LIVE_W) { if (!fastSince) fastSince = now; else if (now - fastSince > 20000) { liveCap = Math.min(MAX_LIVE_W, Math.round(liveCap * 1.25 / 16) * 16); fastSince = 0; fitLive(); } }
  else fastSince = 0;
}

function render(now) {
  requestAnimationFrame(render);
  const rawDt = now - lastFrame;
  const dt = Math.min(rawDt / 1000, 0.033) || 0.016; lastFrame = now;
  if (!active.length || !cells.length || !gl) return;
  if (rawDt > 0 && rawDt < 500) adaptQuality(rawDt, now);

  let allowed = null;
  if (soloBiggest && active.length) {
    const top = rankSmallest
      ? active.reduce((m,e) => ((e.wave ?? 99) < (m.wave ?? 99) ? e : m), active[0])
      : active.reduce((m,e) => ((e.wave ?? -1) > (m.wave ?? -1) ? e : m), active[0]);
    allowed = new Set([top.cam.id]);
  } else if (soloed.size) allowed = soloed;
  const on = e => !(allowed && !allowed.has(e.cam.id)) && !muted.has(e.cam.id) && !(dayOnly && e.luma < LUMA_MIN);
  updateWaveUniforms(now, on);
  // picture sources refresh at ~30Hz (video is ≤30fps); the fluid/composite still run every frame
  if (now - lastMosaic >= 32) {
    lastMosaic = now; refreshFeedCanvases();
    if (freeAmt < 0.99) {
      drawMosaic(now);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, mosaicTex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, mosaic);
    }
    if (freeAmt > 0 && slotEntries.length) uploadAtlas();
  }
  if (fluidOK && fluidOn) {
    // per-location pulses: each feed's blocks are pushed on that spot's own wave period,
    // with force from that spot's own wave height
    if (!reduceMotion && fluidAmt > 0) active.forEach((e, idx) => {
      if (!on(e)) return;
      if (now < e.nextPulse) return;
      const period = e.period ?? DEFAULT_PERIOD;
      e.nextPulse = now + period * 1000 * (0.8 + Math.random() * 0.4);
      const energy = energyOf(e);
      const mine = ownerCells[idx]; if (!mine || !mine.length) return;
      const hits = 2 + Math.floor(energy * 5);
      let plucked = false;
      for (let k = 0; k < hits; k++) {
        const ci = mine[Math.floor(Math.random() * mine.length)];
        const cx = ((ci % cols) + 0.5) * cellPx / W, cy = 1 - ((Math.floor(ci / cols)) + 0.5) * cellPx / H;
        // compass: screen-up is north. Open-Meteo gives the bearing the swell comes FROM,
        // so the push travels the opposite way (+180°). Jittered a little so it isn't a laminar wall.
        const m = fluidAmt * (400 + energy * 2200) * (0.6 + Math.random() * 0.8);
        let dx, dy;
        if (e.dir != null) {
          const bearing = (e.dir + 180 + (Math.random() - 0.5) * 2 * DIR_JITTER_DEG) * Math.PI / 180;
          dx = Math.sin(bearing); dy = Math.cos(bearing);
        } else { const a = Math.random() * Math.PI * 2; dx = Math.cos(a); dy = Math.sin(a); }
        splat(cx, cy, dx * m, dy * m);
        if (!plucked) { pluck(e, cx); pushRing(cx, cy, energy, now); plucked = true; }
      }
    });
    if (!reduceMotion && swellAmt > 0) swellStep(dt);
    fluidStep(dt);
    present(fbo.dye.r.t, now);
  } else present(mosaicTex, now);

  const remain = Math.max(nextRecompose - Date.now(), 0);
  document.getElementById('countdown').textContent = `${String(Math.floor(remain/60000)).padStart(2,'0')}:${String(Math.floor(remain%60000/1000)).padStart(2,'0')}`;
  if (recorder) { const s = Math.floor((now - recStart)/1000); document.getElementById('rectime').textContent = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
}

const lumaCanvas = document.createElement('canvas'); lumaCanvas.width = 24; lumaCanvas.height = 14;
const lumaCtx = lumaCanvas.getContext('2d', { willReadFrequently: true });
setInterval(() => {
  let changed = false;
  [...active].forEach(e => {
    const v = e.video; if (!v || v.readyState < 2) return;
    // frozen? currentTime should advance on a live stream
    if (v.currentTime === e.lastT) { e.stalls++; } else { e.stalls = 0; }
    e.lastT = v.currentTime;
    if (e.stalls >= 3 && e.kill) { e.kill(); return; }   // ~15s with no new frames = dead feed
    // brightness (night feeds stay in the set until the next recompose; daylight is judged at selection time)
    try {
      lumaCtx.drawImage(v, 0, 0, 24, 14);
      const px = lumaCtx.getImageData(0, 0, 24, 14).data;
      let sum = 0;
      for (let i = 0; i < px.length; i += 4) sum += (px[i]*0.299 + px[i+1]*0.587 + px[i+2]*0.114);
      const luma = sum / (px.length / 4) / 255;
      if ((luma < LUMA_MIN) !== (e.luma < LUMA_MIN)) changed = true;
      e.luma = luma;
    } catch (err) {}
  });
  if (changed) renderChannels();
}, 5000);
function visibleEntries() { return active.map((e, i) => i); }   // fixed set: every loaded cam keeps its share of the frame

/* ================= AUDIO: plucked strings (Karplus-Strong) ================= */
/* Every fluid pulse is a pluck. Pitch <- wave period (long swell = low string),
   loudness & brightness <- wave height, sustain <- period, stereo pan <- where
   on screen the pluck landed. Muted / soloed channels are silent because pulses
   are gated before they reach here. */
let audioOn = false, actx = null, masterGain = null;
const SCALES = {
  'PENTATONIC': [0, 3, 5, 7, 10, 12, 15, 17, 19, 22],
  'MAJOR':      [0, 2, 4, 5, 7, 9, 11, 12, 14, 16],
  'MINOR':      [0, 2, 3, 5, 7, 8, 10, 12, 14, 15],
  'OPEN D':     [0, 7, 12, 16, 19, 24, 28, 31, 36, 43]
};
let scaleName = 'PENTATONIC';
let PENT = SCALES[scaleName];
function initAudio() {
  actx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = actx.createGain(); masterGain.gain.value = 0.5;
  const comp = actx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.ratio.value = 6;
  masterGain.connect(comp); comp.connect(actx.destination);
}
function freqForPeriod(period) {
  const p = Math.min(Math.max(period ?? DEFAULT_PERIOD, 2), 18);
  const t = 1 - (p - 2) / 16;                      // long period -> low end
  const deg = PENT[Math.round(t * (PENT.length - 1))];
  return 82.41 * Math.pow(2, deg / 12);            // up from low E (E2)
}
function pluck(entry, panPos) {
  if (!audioOn || !actx) return;
  const energy = energyOf(entry);
  const freq = freqForPeriod(entry.period);
  const sr = actx.sampleRate, N = Math.round(sr / freq);
  const buf = actx.createBuffer(1, N, sr), d = buf.getChannelData(0);
  for (let i = 0; i < N; i++) d[i] = Math.random() * 2 - 1;   // the pick attack
  const src = actx.createBufferSource(); src.buffer = buf;
  const delay = actx.createDelay(1); delay.delayTime.value = 1 / freq;
  const fb = actx.createGain();
  fb.gain.value = 0.945 + 0.05 * Math.min((entry.period ?? DEFAULT_PERIOD) / 18, 1); // long swell rings longer
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.value = 800 + energy * 4200;                    // big waves pluck brighter
  const vel = actx.createGain(); vel.gain.value = 0.12 + energy * 0.5;
  const pan = actx.createStereoPanner ? actx.createStereoPanner() : null;
  if (pan) pan.pan.value = (panPos * 2 - 1) * 0.8;
  src.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay);   // the string
  delay.connect(vel); if (pan) { vel.connect(pan); pan.connect(masterGain); } else vel.connect(masterGain);
  src.start();
  const life = 2500 + (entry.period ?? DEFAULT_PERIOD) * 250;
  vel.gain.setTargetAtTime(0, actx.currentTime + life / 1000, 0.3);
  setTimeout(() => { try { src.stop(); src.disconnect(); delay.disconnect(); lp.disconnect(); fb.disconnect(); vel.disconnect(); pan?.disconnect(); } catch(e){} }, life + 1500);
}

/* ================= CYCLE ================= */
let bootTried = 0;
function setBoot(phase, pct) {
  if (phase != null) document.getElementById('bootphase').textContent = phase;
  if (pct != null) document.getElementById('bootfill').style.width = Math.min(Math.max(pct, 0), 100) + '%';
  document.getElementById('bootlive').textContent = active.length;
  document.getElementById('boottried').textContent = bootTried;
}
const bootPct = () => 12 + 88 * Math.min(active.length / MAX_ACTIVE, 1);
async function recompose(isBoot) {
  if (isBoot) { bootTried = 0; setBoot('fetching wave heights', 4); log('· fetching wave heights (open-meteo marine)…'); }
  try { waves = await fetchWaves(CAMS); if (isBoot) log('· wave data received', 'ok'); }
  catch (e) { if (isBoot) log('· wave data failed — equal weighting', 'bad'); }
  let pool = CAMS.filter(c => !deadIds.has(c.id))
    .filter(c => oceanFilter === 'ALL' || basinOf(c.lat, c.lon) === oceanFilter);
  if (dayOnly) { const lit = pool.filter(c => sunUp(c.lat, c.lon)); if (lit.length >= 3) pool = lit; }
  const ranked = pool
    .map(c => ({ ...c, wave: waves[c.id] ?? null }))
    .sort((a,b) => rankSmallest ? (a.wave ?? 99)-(b.wave ?? 99) : (b.wave ?? 0)-(a.wave ?? 0));
  if (isBoot) {
    setBoot('ordering by wave height', 9);
    log(`· ordered ${ranked.length} cams by ${rankSmallest ? 'smallest' : 'biggest'} wave height:`);
    ranked.slice(0, 14).forEach((c, i) => { const d = log(`   ${String(i+1).padStart(2,'0')}  ${c.name}  ${fmtH(c.wave)}`, 'rank'); });
    if (ranked.length > 14) log(`   … +${ranked.length - 14} more in reserve`, 'rank');
    setBoot('trying cameras', 12);
  }
  const wantedIds = new Set(ranked.slice(0, MAX_ACTIVE).map(c => c.id)); const keep = [];
  active.forEach(e => { if (wantedIds.has(e.cam.id)) { e.wave = waves[e.cam.id] ?? e.wave; e.period = periods[e.cam.id] ?? e.period; e.dir = dirs[e.cam.id] ?? e.dir; keep.push(e); } else stopEntry(e); });
  active = keep;
  const haveIds = new Set(active.map(e => e.cam.id));
  const queue = ranked.filter(c => !haveIds.has(c.id));
  const probe = async (cam) => {
    const line = isBoot ? log(`· trying ${cam.name} … ${fmtH(cam.wave)}${PROXY ? '  direct+proxy…' : ''}`, 'trying') : null;
    // race direct and proxied; first to deliver a readable frame wins, the loser is torn down
    const attempts = [startFeed(cam, false)]; if (PROXY) attempts.push(startFeed(cam, true));
    let feed = null;
    await new Promise(res => { let left = attempts.length; attempts.forEach(p => p.then(f => {
      if (f && !feed) { feed = f; res(); } else if (f) { try { f.hls?.destroy(); } catch(x){} f.video.remove(); }
      if (--left === 0) res(); })); });
    if (feed && active.length < MAX_ACTIVE) {
      const entry = { cam, video: feed.video, hls: feed.hls, wave: cam.wave, period: periods[cam.id], dir: dirs[cam.id], nextPulse: 0, luma: 1, lastT: -1, stalls: 0 };
      watchEntry(entry); active.push(entry);
      if (line) { line.className = 'ok'; line.textContent = `· ${cam.name} … ${fmtH(cam.wave)}  LIVE`; }
      if (!isBoot) { assignCells(true); updateHud(); renderFooter(); }
    } else if (feed) { try { feed.hls?.destroy(); } catch(x){} feed.video.remove(); if (line) line.textContent = `· ${cam.name} … ${fmtH(cam.wave)}  (spare)`; }
    else { deadIds.add(cam.id); if (line) { line.className = 'bad'; line.textContent = `· ${cam.name} … ${fmtH(cam.wave)}  DEAD`; } }
    if (isBoot) { bootTried++; setBoot(null, bootPct()); }
  };
  while (queue.length && active.length < MAX_ACTIVE) {
    await Promise.all(queue.splice(0, CHECK_PARALLEL).map(probe));
  }
  if (isBoot) setBoot(active.length >= MAX_ACTIVE ? 'set locked' : 'partial set', 100);
  if (!active.length) {
    log(''); log('NO FEEDS SURVIVED — streams may be dead or CORS-blocked from this origin.', 'bad'); log('Set PROXY, or refresh the cam list.', 'bad');
    retrybtn.style.display = 'inline-block'; return false;
  }
  assignCells(!isBoot); updateHud(); renderFooter(); nextRecompose = Date.now() + recomposeMin * 60000; return true;
}
let recomposeTimer = null;
async function boot() {
  retrybtn.style.display = 'none'; bootlog.innerHTML = ''; deadIds = new Set();
  document.getElementById('bootneed').textContent = MAX_ACTIVE; setBoot('starting', 0);
  log(`· ${CAMS.length} cams in roster · activating top ${MAX_ACTIVE} by wave height${LOW_POWER ? ' · low-power device' : ''}`);
  if (!gl) log('· WebGL unavailable — cannot render', 'bad');
  else if (!fluidOK) log('· half-float textures unsupported — fluid overlay disabled', 'bad');
  const ok = await recompose(true);
  // the set stays fixed until the recompose timer (or a setting change) asks for a new one
  if (ok) { setTimeout(() => bootEl.classList.add('gone'), 600); if (!recomposeTimer) recomposeTimer = setInterval(() => {
      if (Date.now() >= nextRecompose) { deadIds = new Set(); recompose(false); }
    }, 5000); }
}
retrybtn.addEventListener('click', boot);

/* ================= KEYS ================= */
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'h') document.body.classList.toggle('hud-hidden');
  if (k === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  if (k === 'w') fluidOn = !fluidOn;
  if (k === 'r') recorder ? stopRec() : startRec();
  if (k === 's') savePNG();
  if (k === 'x') { if (active.length) assignCells(true); }
  if (k === 'b') {   // toggle freeform sea
    freeAmt = freeAmt > 0.5 ? 0 : 1;
    document.getElementById('freeslider').value = freeAmt; document.getElementById('freeval').textContent = freeAmt.toFixed(2);
  }
});

initGL();
fitLive();
requestAnimationFrame(render);
boot();
</script>
